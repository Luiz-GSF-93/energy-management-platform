name: CCEE private readings R1
on:
  pull_request:
    paths:
      - 'backend/src/modules/ccee/**'
      - 'backend/src/database/migrations/*ccee*'
      - 'backend/test/database/ccee*'
      - 'backend/package*.json'
      - 'frontend/app/backoffice/ccee-data/**'
      - 'frontend/app/components/Ccee*'
      - 'frontend/app/components/OperationsWorkspace.tsx'
      - 'backend/src/modules/ocr/eva-market*'
      - 'backend/src/modules/ocr/ocr.module.ts'
      - 'frontend/app/backoffice/platform-costs/CceeMetrics.tsx'
      - 'frontend/test/ccee*'
      - 'frontend/app/lib/api/plans.ts'
      - 'frontend/app/components/LicenseFromPlan.tsx'
      - 'frontend/app/backoffice/plans/**'
      - 'backend/src/modules/plans/**'
      - 'backend/src/modules/licenses/**'
      - '.github/workflows/ccee-private-readings.yml'
permissions:
  contents: read
jobs:
  private-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: backend
      - run: node node_modules/jest/bin/jest.js --runInBand src/modules/ccee src/modules/platform-costs/service-catalog.spec.ts src/modules/ocr/eva-closing-dialogue.service.spec.ts
        working-directory: backend
      - run: node test/database/ccee-dri.test.mjs
        working-directory: backend
      - run: node test/database/ccee-data-license.test.mjs
        working-directory: backend
      - run: node test/database/ccee-market.test.mjs
        working-directory: backend
      - run: node node_modules/jest/bin/jest.js --runInBand src/modules/ocr/eva-market.controller.spec.ts
        working-directory: backend
      - name: Disposable PostgreSQL hourly schedule lab
        working-directory: backend
        run: |
          docker run -d --name ccee-dri-lab-market-ci --network none -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17
          trap 'docker rm -f ccee-dri-lab-market-ci' EXIT
          for i in $(seq 1 30); do docker exec ccee-dri-lab-market-ci pg_isready -U postgres && break; sleep 1; done
          CCEE_MARKET_TEST_CONTAINER=ccee-dri-lab-market-ci node test/database/ccee-market.test.mjs
      - name: Disposable PostgreSQL DRI concurrency lab
        working-directory: backend
        run: |
          docker run -d --name ccee-dri-lab-ci --network none -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17
          trap 'docker rm -f ccee-dri-lab-ci' EXIT
          for i in $(seq 1 30); do docker exec ccee-dri-lab-ci pg_isready -U postgres && break; sleep 1; done
          CCEE_DRI_TEST_CONTAINER=ccee-dri-lab-ci node test/database/ccee-dri.test.mjs
      - run: node test/database/ccee-r1.test.mjs
        working-directory: backend
      - run: node test/database/ccee-private-intake.test.mjs
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: node test/ccee-dri.cjs
        working-directory: frontend
      - run: node test/ccee-data.cjs
        working-directory: frontend
      - run: node test/ccee-market.cjs
        working-directory: frontend
      - run: node test/license-governance.cjs
        working-directory: frontend
      - run: node test/ccee-reconciliation.cjs
        working-directory: frontend
      - run: node test/ccee-integration.cjs
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
