name: Trading approval and formalization
on:
  pull_request:
    paths:
      - 'backend/src/modules/trading-hub/**'
      - 'backend/src/database/migrations/2026126*.sql'
      - 'backend/src/database/migrations/20261325*.sql'
      - 'backend/src/database/migrations/20261326*.sql'
      - 'backend/src/database/migrations/20261327*.sql'
      - 'backend/src/database/migrations/20261328*.sql'
      - 'backend/src/database/migrations/20261329*.sql'
      - 'backend/test/database/owner-verified-publications.test.mjs'
      - 'backend/src/modules/ocr/eva-unit-fees.spec.ts'
      - 'frontend/app/components/TradingClientDashboard.tsx'
      - 'frontend/test/trading-client-monitor.cjs'
      - 'backend/test/database/trading-quotes.test.mjs'
      - 'backend/test/database/trading-workflow-expiry.test.mjs'
      - 'frontend/app/components/TradingCommercialTerms.tsx'
      - 'frontend/app/components/TradingConversation.tsx'
      - 'frontend/app/components/SupplierQuoteConversation.tsx'
      - 'frontend/test/trading-quotation-experience.cjs'
      - 'frontend/app/components/TradingSupplyFields.tsx'
      - 'frontend/app/lib/trading-supply.ts'
      - 'frontend/test/trading-supply.cjs'
      - 'frontend/test/trading-required-fields.cjs'
      - 'backend/src/database/migrations/20261270_trading_reminders_shared_budget.sql'
      - 'backend/src/modules/client-portal-licenses/portal-route-module.ts'
      - 'backend/src/modules/whatsapp-delivery/whatsapp-templates.service.ts'
      - 'backend/test/database/trading-workflow.test.mjs'
      - 'frontend/app/backoffice/trading-hub/**'
      - 'frontend/app/cotacao/**'
      - 'frontend/app/components/TradingApprovalBell.tsx'
      - 'frontend/app/components/BackofficeShell.tsx'
      - 'frontend/app/components/PortalWorkspace.tsx'
      - 'frontend/app/components/ClientPortalContent.tsx'
      - 'frontend/test/trading-approvals.cjs'
      - '.github/workflows/trading-approvals.yml'
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: backend
      - run: npm test -- --runInBand --runTestsByPath src/modules/trading-hub/trading-client-monitor.service.spec.ts src/modules/trading-hub/trading-client-monitor.model.spec.ts src/modules/trading-hub/trading-supply.spec.ts src/modules/ocr/eva-unit-fees.spec.ts src/modules/trading-hub/trading-mail-budget.spec.ts src/modules/trading-hub/trading-terms.spec.ts src/modules/trading-hub/trading-communication.spec.ts src/modules/trading-hub/trading-workflow.spec.ts src/modules/trading-hub/trading.spec.ts src/modules/trading-hub/trading-portal.spec.ts src/modules/trading-hub/trading-resend.spec.ts src/modules/trading-hub/trading-mail.spec.ts src/modules/trading-hub/trading-email-template.spec.ts
        working-directory: backend
      - run: node test/database/owner-verified-publications.test.mjs && node test/database/trading-client-monitor.test.mjs && node test/database/trading-supply.test.mjs && node test/database/trading-workflow.test.mjs && node test/database/trading-quotes.test.mjs && node test/database/trading-workflow-expiry.test.mjs
        working-directory: backend
      - run: npm run build && node test/database/verify-management-allocations.mjs
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
      - run: node test/trading-client-monitor.cjs && node test/trading-approvals.cjs && node test/trading-quotation-experience.cjs && node test/trading-analysis.cjs && node test/trading-supply.cjs && node test/trading-required-fields.cjs && node test/trading-matrix-review.cjs
        working-directory: frontend
      - run: npm run build -- --webpack
        working-directory: frontend
