name: Portal XML scoped runtime compatibility
on:
  pull_request:
    paths:
      - 'backend/src/database/migrations/20261307_portal_xml_conflict_runtime_compatibility.sql'
      - 'backend/test/database/portal-xml-runtime.test.cjs'
      - '.github/workflows/portal-xml-runtime.yml'
permissions:
  contents: read
jobs:
  scoped-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: backend
      - run: node test/database/portal-xml-runtime.test.cjs
        working-directory: backend
      - run: node test/database/portal-acl-runtime.test.cjs && node test/portal-customer-access.cjs
        working-directory: backend
