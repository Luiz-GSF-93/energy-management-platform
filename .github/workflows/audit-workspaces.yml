name: Audit workspaces isolation and integrity
on:
  pull_request:
    paths:
      - 'backend/src/modules/audit/**'
      - 'backend/src/database/migrations/20261218_audit_workspaces.sql'
      - 'backend/src/database/migrations/20261219_audit_historical_dates.sql'
      - 'backend/test/audit-workspaces.cjs'
      - 'frontend/app/components/Audit*'
      - 'frontend/app/backoffice/audit/**'
      - 'frontend/app/backoffice/platform-audit/**'
      - 'frontend/test/audit-workspaces.cjs'
      - '.github/workflows/audit-workspaces.yml'
permissions:
  contents: read
jobs:
  audit-isolation-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: backend
      - run: node test/audit-workspaces.cjs
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm install --no-save --package-lock=false --ignore-scripts jsdom@26.1.0
        working-directory: frontend
      - run: node test/audit-workspaces.cjs
        working-directory: frontend
      - run: npm run build -- --webpack
        working-directory: frontend
