name: EVA Search infrastructure preparation
on:
  pull_request:
    paths: ['infra/eva-search/**', '.github/workflows/eva-search-infrastructure.yml']
permissions:
  contents: read
jobs:
  offline-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node infra/eva-search/validate.cjs
