name: EVA document intake performance and XML
on:
  pull_request:
    paths:
      - 'backend/src/modules/portal-workspace/automatic-*'
      - 'backend/src/modules/portal-workspace/identity-continuation*'
      - 'backend/src/modules/ocr/invoice-demand-reference*'
      - 'backend/src/modules/ocr/calculation-autofill*'
      - 'backend/src/modules/ocr/closing-ccee-local.ts'
      - 'backend/src/modules/ocr/historical-cpfl-evidence.spec.ts'
      - 'backend/src/database/migrations/20261304_ccee_closing_sources.sql'
      - 'backend/test/ccee-closing-sources.cjs'
      - 'frontend/app/backoffice/contracts/eva-guided-questions.ts'
      - 'frontend/app/backoffice/contracts/MonthlyInputs.tsx'
      - 'frontend/test/eva-guided-review.cjs'
      - 'backend/src/modules/ocr/ccee-cost-estimate*'
      - 'backend/src/modules/ocr/closing-demand-context.ts'
      - 'backend/src/database/migrations/20261297_management_open_ended_terms.sql'
      - 'backend/test/database/verify-contract-configurations.mjs'
      - 'frontend/app/backoffice/contracts/CceeEstimateProposal.tsx'
      - 'frontend/app/backoffice/contracts/EvaGuidedReview.tsx'
      - 'frontend/app/backoffice/contracts/CommercialTerms.tsx'
      - 'frontend/test/ccee-estimate-proposal.cjs'
      - 'backend/src/database/migrations/20261296_eva_audited_continue.sql'
      - 'backend/src/database/migrations/20261299_eva_distributor_address_review.sql'
      - 'backend/src/database/migrations/20261300_eva_restore_original.sql'
      - 'backend/src/modules/ocr/supplier-invoice-cost-draft.ts'
      - 'backend/src/modules/ocr/invoice-identity-with-history*'
      - 'backend/src/modules/ocr/invoice-identity-preflight*'
      - 'backend/test/eva-identity-triage-sql.cjs'
      - 'backend/src/modules/portal-workspace/xml-intake-context*'
      - 'backend/src/modules/ocr/fiscal-xml*'
      - 'backend/src/modules/ocr/supplier-unit-identity*'
      - 'backend/src/modules/ocr/supplier-invoice-proposal*'
      - 'backend/src/modules/ocr/closing-coordination*'
      - 'backend/src/modules/ocr/invoice-reading-context*'
      - 'backend/src/modules/ocr/backoffice-ai.service*'
      - 'backend/src/modules/ocr/azure-backoffice-ai.connector*'
      - 'backend/src/modules/ocr/ocr-assistant.service*'
      - 'backend/src/modules/ocr/eva-assisted-closing*'
      - 'backend/src/modules/ocr/source-preparation.service*'
      - 'frontend/app/backoffice/contracts/AssistedClosingReview*'
      - 'frontend/test/eva-assisted-closing.cjs'
      - 'backend/src/database/migrations/20261294_eva_source_revisions.sql'
      - 'backend/src/database/migrations/2026128[6789]*'
      - 'backend/test/eva-fiscal-xml.cjs'
      - 'backend/test/eva-automatic-intake.cjs'
      - 'backend/src/database/migrations/20261290_eva_reconcile_before_explanation.sql'
      - 'backend/src/database/migrations/20261291_eva_source_rpc_transaction_mode.sql'
      - 'backend/src/database/migrations/20261292_eva_operations_global_rollout.sql'
      - 'backend/src/database/migrations/20261293_eva_operations_publication_proof.sql'
      - 'backend/src/modules/portal-workspace/automatic-rollout.spec.ts'
      - 'backend/src/modules/portal-workspace/portal-workspace.module.ts'
      - 'frontend/app/backoffice/documents/**'
      - 'frontend/test/eva-operations.cjs'
      - 'frontend/app/components/AutomaticInvoiceIntake*'
      - 'frontend/app/components/eva-upload-batch.ts'
      - 'frontend/test/eva-upload-batch.cjs'
      - 'frontend/test/eva-company-upload.cjs'
      - '.github/workflows/eva-intake-performance.yml'
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: backend
      - run: npm test -- --runInBand --runTestsByPath src/modules/ocr/fiscal-xml.spec.ts src/modules/ocr/invoice-demand-reference.spec.ts src/modules/ocr/calculation-autofill.spec.ts src/modules/ocr/ccee-cost-estimate.spec.ts src/modules/ocr/closing-source-scope.spec.ts src/modules/ocr/historical-cpfl-evidence.spec.ts src/modules/ccee/ccee-service-policy.spec.ts src/modules/contracts/services/management-fee.spec.ts src/modules/contracts/services/configurations.service.spec.ts src/modules/ocr/invoice-reading-context.spec.ts src/modules/ocr/backoffice-ai.service.spec.ts src/modules/ocr/azure-backoffice-ai.connector.spec.ts src/modules/ocr/ocr-assistant.service.spec.ts src/modules/ocr/supplier-unit-identity.spec.ts src/modules/ocr/closing-coordination.spec.ts src/modules/ocr/supplier-invoice-proposal.spec.ts src/modules/ocr/eva-assisted-closing.service.spec.ts src/modules/ocr/eva-assisted-closing.model.spec.ts src/modules/portal-workspace/automatic-intake-context.spec.ts src/modules/portal-workspace/automatic-rollout.spec.ts src/modules/portal-workspace/automatic-intake.worker.spec.ts src/modules/portal-workspace/automatic-intake.service.spec.ts src/modules/portal-workspace/automatic-intake-triage.spec.ts src/modules/portal-workspace/identity-continuation.spec.ts src/modules/portal-workspace/automatic-explanation.worker.spec.ts src/modules/ocr/invoice-identity-preflight.spec.ts src/modules/ocr/invoice-identity-with-history.spec.ts src/modules/ocr/source-preparation.service.spec.ts
        working-directory: backend
      - run: node test/eva-fiscal-xml.cjs && node test/ccee-closing-sources.cjs && node test/eva-automatic-intake.cjs && node test/eva-identity-triage-sql.cjs
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: node test/database/verify-contract-configurations.mjs
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
      - run: node test/ccee-estimate-proposal.cjs && node test/management-fees.cjs && node test/eva-assisted-closing.cjs && node test/eva-guided-review.cjs && node test/eva-operations.cjs && node test/documents-upload-routing.cjs && node test/automatic-intake.cjs && node test/eva-upload-batch.cjs && node test/eva-company-upload.cjs && node test/automatic-intake-triage.cjs && node test/ocr-original-invoice.cjs
        working-directory: frontend
      - run: npm run build -- --webpack
        working-directory: frontend
