name: EVA verified preparation recovery
on:
  workflow_dispatch:
  pull_request:
    paths: ['backend/src/database/migrations/2026132[123]*', 'backend/test/verified-preparation-receipts.cjs', 'backend/test/eva-calculation-domain-conflicts.cjs', 'backend/src/modules/ocr/**', 'backend/src/modules/operations/eva-invoice-attention.service.ts', '.github/workflows/eva-verified-preparation-receipts.yml']
  push:
    branches: [main]
    paths: ['backend/src/database/migrations/2026132[123]*', 'backend/test/verified-preparation-receipts.cjs', 'backend/test/eva-calculation-domain-conflicts.cjs', '.github/workflows/eva-verified-preparation-receipts.yml']
permissions:
  contents: read
jobs:
  verified-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: backend
      - run: npx jest src/modules/ocr/calculation-domain-conflicts.spec.ts src/modules/ocr/commercial-closing-history.spec.ts src/modules/ocr/eva-assisted-closing.service.spec.ts src/modules/ocr/eva-closing-changes.service.spec.ts src/modules/ocr/eva-tariff-workbench.service.spec.ts --runInBand
        working-directory: backend
      - run: node test/verified-preparation-receipts.cjs && node test/eva-calculation-domain-conflicts.cjs && node test/eva-continuation-conflicts.cjs && node test/eva-automatic-intake.cjs
        working-directory: backend
      - run: npm run build
        working-directory: backend
