name: Private client invoices and support
on:
  pull_request:
    paths:
      - 'backend/src/modules/portal-workspace/**'
      - 'backend/src/modules/portal-insights/**'
      - 'backend/src/modules/energy-prices/**'
      - 'backend/src/modules/reports/**'
      - 'backend/src/database/migrations/20261215*.sql'
      - 'backend/src/database/migrations/20261216*.sql'
      - 'frontend/app/components/usePublicationRefresh.ts'
      - 'frontend/app/backoffice/reports/ReportWorkspace.tsx'
      - 'backend/src/modules/operations/**'
      - 'backend/src/database/migrations/2026112*.sql'
      - 'backend/src/database/migrations/20261130*.sql'
      - 'backend/src/database/migrations/20261201*.sql'
      - 'backend/src/database/migrations/20261203*.sql'
      - 'backend/src/database/migrations/20261204*.sql'
      - 'backend/src/database/migrations/20261207*.sql'
      - 'backend/src/database/migrations/20261209*.sql'
      - 'backend/src/database/migrations/20261210*.sql'
      - 'backend/src/database/migrations/20261211*.sql'
      - 'frontend/app/components/PublishedClientInsights*'
      - 'frontend/test/portal-composition-corrections.cjs'
      - 'backend/src/modules/ocr/ocr-identity-resume*'
      - 'backend/src/modules/ocr/ocr-queue.service*'
      - 'backend/src/modules/ocr/ocr.controller.ts'
      - 'frontend/app/backoffice/documents/OcrIdentityResume.tsx'
      - 'frontend/app/backoffice/documents/OcrDocumentStatus.tsx'
      - 'backend/test/portal-client-workspace.cjs'
      - 'backend/test/portal-cost-composition.cjs'
      - 'backend/test/ocr-identity-resume.cjs'
      - 'frontend/app/components/Portal*'
      - 'frontend/test/portal-workspace-ui.cjs'
      - 'frontend/test/portal-usage-ui.cjs'
      - '.github/workflows/portal-client-workspace.yml'
permissions:
  contents: read
jobs:
  isolated-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['55486:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: backend
      - run: node node_modules/jest/bin/jest.js --runInBand src/modules/portal-workspace src/modules/portal-insights src/modules/energy-prices src/modules/reports src/modules/bot-reports src/modules/operations src/modules/sms-delivery src/modules/customer-notices src/modules/ocr/eva-product-guide.spec.ts src/modules/ocr/ocr-identity-resume.spec.ts src/modules/ocr/ocr-queue.service.spec.ts src/modules/ocr/invoice-identity-preflight.spec.ts src/modules/ocr/ocr.worker.spec.ts src/modules/ocr/ocr-assistant.service.spec.ts src/modules/documents/services/documents.upload.spec.ts src/modules/whatsapp-delivery
        working-directory: backend
      - run: node test/portal-client-workspace.cjs
        working-directory: backend
      - run: npm install --prefix /tmp/portal-pg-driver --ignore-scripts pg@8.16.3
      - run: node test/portal-client-workspace.cjs
        working-directory: backend
        env:
          NODE_PATH: /tmp/portal-pg-driver/node_modules
          PORTAL_WORKSPACE_TEST_PG_PORT: '55486'
      - run: npm run build
        working-directory: backend
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: node test/portal-workspace-ui.cjs && node test/portal-identity-ui.cjs && node test/portal-usage-ui.cjs && node test/portal-composition-corrections.cjs
        working-directory: frontend
      - run: npm run build -- --webpack
        working-directory: frontend
