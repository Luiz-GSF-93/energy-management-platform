name: Source-backed automatic preparation
on:
  pull_request:
    paths:
      - 'backend/src/modules/ocr/calculation-autofill*'
      - 'backend/src/modules/ocr/eva-assisted-closing*'
      - 'backend/src/database/migrations/20261110_eva_assisted_closing.sql'
      - 'backend/test/eva-assisted-closing.cjs'
      - 'frontend/app/backoffice/contracts/AssistedClosingReview*'
      - 'frontend/test/eva-assisted-closing.cjs'
      - 'backend/src/modules/ocr/calculation-operational-proposal*'
      - 'frontend/app/backoffice/contracts/OperationalProposalView.tsx'
      - 'backend/src/modules/ocr/ocr-resolution.service.ts'
      - 'backend/src/modules/documents/services/documents.service.ts'
      - 'backend/src/modules/documents/services/documents.upload.spec.ts'
      - 'frontend/app/backoffice/documents/page.tsx'
      - 'backend/src/database/migrations/20261109_calculation_autofill.sql'
      - 'backend/test/calculation-autofill.cjs'
      - 'frontend/app/backoffice/contracts/AutomaticPreparation.tsx'
      - 'frontend/app/backoffice/contracts/ContractReadiness.tsx'
      - 'frontend/app/backoffice/contracts/CalculationPreparation.tsx'
      - 'frontend/app/backoffice/contracts/MonthlyCosts.tsx'
      - 'frontend/app/backoffice/contracts/MonthlyInputs.tsx'
      - 'frontend/app/backoffice/documents/OcrResolution.tsx'
      - 'frontend/test/calculation-autofill.cjs'
      - 'frontend/test/preparation-navigation.cjs'
      - 'backend/src/modules/ocr/eva-tariff-*'
      - 'backend/src/modules/ocr/eva-global-model*'
      - 'backend/src/modules/ocr/invoice-comparison-v2*'
      - 'backend/src/modules/ocr/azure-backoffice-ai.connector*'
      - 'backend/src/modules/ocr/backoffice-ai.service*'
      - 'backend/src/modules/ocr/eva-closing-dialogue*'
      - 'backend/src/modules/ocr/eva-closing-context*'
      - 'backend/src/modules/ocr/eva-closing-changes*'
      - 'backend/src/database/migrations/20261112_eva_closing_changes.sql'
      - 'backend/test/eva-closing-changes.cjs'
      - 'frontend/test/eva-closing-changes.cjs'
      - 'backend/src/database/migrations/20261111*'
      - 'frontend/app/backoffice/contracts/Tariff*'
      - 'frontend/app/backoffice/contracts/ClosingConversation.tsx'
      - '.github/workflows/calculation-autofill.yml'
permissions:
  contents: read
jobs:
  private-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['55484:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: backend
      - run: node node_modules/jest/bin/jest.js --runInBand --runTestsByPath src/modules/ocr/azure-backoffice-ai.connector.spec.ts src/modules/ocr/backoffice-ai.service.spec.ts src/modules/ocr/eva-global-model.spec.ts src/modules/ocr/invoice-comparison-v2.spec.ts src/modules/ocr/eva-tariff-workbench.model.spec.ts src/modules/ocr/eva-tariff-workbench.service.spec.ts src/modules/ocr/eva-closing-dialogue.service.spec.ts src/modules/ocr/eva-closing-context.spec.ts src/modules/ocr/eva-closing-changes.model.spec.ts src/modules/ocr/eva-closing-changes.service.spec.ts src/modules/ocr/eva-assisted-closing.model.spec.ts src/modules/ocr/eva-assisted-closing.service.spec.ts src/modules/ocr/calculation-operational-proposal.spec.ts src/modules/ocr/calculation-autofill.spec.ts src/modules/ocr/ocr-resolution.service.spec.ts src/modules/ocr/ocr-autofill.spec.ts src/modules/ocr/ocr-autofill.service.spec.ts src/modules/contracts/services/contract-supplier-cost.spec.ts src/modules/contracts/services/management-fee.spec.ts src/modules/contracts/services/fee-adjustment.spec.ts src/modules/contracts/services/preparation.spec.ts src/modules/contracts/services/tariff-library-plan.spec.ts src/modules/contracts/services/tariff-library.service.spec.ts src/modules/contracts/services/monthly-inputs-ocr-edit.spec.ts src/modules/documents/services/documents.upload.spec.ts src/modules/documents/controllers/documents.upload-http.spec.ts
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: node test/eva-tariff-workbench.cjs
        working-directory: backend
      - run: node test/eva-closing-changes.cjs
        working-directory: backend
      - run: node test/eva-assisted-closing.cjs
        working-directory: backend
      - run: node test/calculation-autofill.cjs
        working-directory: backend
      - run: npm install --prefix /tmp/calculation-pg-driver --ignore-scripts pg@8.16.3
      - run: node test/calculation-autofill.cjs
        working-directory: backend
        env:
          NODE_PATH: /tmp/calculation-pg-driver/node_modules
          CALCULATION_AUTOFILL_TEST_PG_PORT: '55484'
      - run: node test/eva-assisted-closing.cjs
        working-directory: backend
        env:
          NODE_PATH: /tmp/calculation-pg-driver/node_modules
          EVA_CLOSING_TEST_PG_PORT: '55484'
      - run: node test/eva-tariff-workbench.cjs
        working-directory: backend
        env:
          NODE_PATH: /tmp/calculation-pg-driver/node_modules
          EVA_TARIFF_TEST_PG_PORT: '55484'
      - run: node test/eva-closing-changes.cjs
        working-directory: backend
        env:
          NODE_PATH: /tmp/calculation-pg-driver/node_modules
          EVA_CHANGES_TEST_PG_PORT: '55484'
      - run: node test/financial-settlements.cjs
        working-directory: backend
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: node test/eva-closing-changes.cjs && node test/eva-tariff-dialogue.cjs && node test/eva-assisted-closing.cjs && node test/calculation-autofill.cjs && node test/ocr-resolution-ui.cjs && node test/preparation-navigation.cjs
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
