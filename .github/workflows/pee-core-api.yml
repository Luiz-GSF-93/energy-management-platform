name: PEE Core gateway (isolated, no deployment)
on:
  pull_request:
    paths:
      - 'services/pee-core-api/**'
      - 'docs/integrations/pee-core-installation.md'
      - '.github/workflows/pee-core-api.yml'
permissions:
  contents: read
jobs:
  gateway-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
        working-directory: services/pee-core-api

