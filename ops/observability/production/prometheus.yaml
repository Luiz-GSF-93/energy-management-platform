global:
  scrape_interval: 15s
  evaluation_interval: 30s
  scrape_timeout: 3s
rule_files: [/etc/prometheus/alerts.yaml]
scrape_configs:
  - job_name: energyos-runtime
    sample_limit: 4000
    label_limit: 12
    label_name_length_limit: 64
    label_value_length_limit: 128
    body_size_limit: 1MB
    static_configs:
      - targets: [energyos-otel-collector.railway.internal:8889]
