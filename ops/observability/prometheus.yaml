global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 3s
rule_files: [/etc/prometheus/alerts.yaml]
scrape_configs:
  - job_name: energyos-isolated
    sample_limit: 4000
    label_limit: 12
    label_name_length_limit: 64
    label_value_length_limit: 128
    body_size_limit: 1MB
    static_configs:
      - targets: [collector:8889]
